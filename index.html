<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>더스크그룹 경영보고</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#eef1f8;color:#1e2841;font-size:13px;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
.hdr{background:#16213e;color:#fff;padding:24px 36px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hdr-l p{font-size:11px;color:#7a90b8;margin-top:4px}
.logo{font-size:22px;font-weight:700;color:#fff;letter-spacing:-.5px}
.logo span{color:#4e8ef7}
.main{padding:48px 36px}
.hub{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:960px;margin:0 auto}
.hub-card{background:#fff;border:1px solid #d8e0ee;border-radius:16px;padding:32px 26px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 4px rgba(30,40,65,.06);transition:box-shadow .15s,transform .15s}
.hub-card:hover{box-shadow:0 6px 20px rgba(30,40,65,.14);transform:translateY(-3px)}
.hub-card.featured{border:2px solid #3a78d2}
.hub-icon{font-size:32px}
.hub-title{font-size:18px;font-weight:700;color:#1e2841}
.hub-desc{font-size:12px;color:#8090b0}
.hub-badge{font-size:10px;font-weight:600;padding:4px 12px;border-radius:20px;width:fit-content;margin-top:auto}
.hub-badge.ready{background:#e6f9f0;color:#12874a}
.hub-badge.soon{background:#fdf3e2;color:#8a6414}
.footer{text-align:center;padding:32px;color:#a0adc4;font-size:11px;margin-top:8px}
@media(max-width:720px){.hub{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-l">
    <div class="logo">DUSK<span>.</span></div>
    <p>경영지원팀 · 경영보고 포털</p>
  </div>
  <div>
    <h1 style="font-size:13px;font-weight:400;color:#7a90b8">더스크그룹 경영보고</h1>
  </div>
</div>

<div class="main">
  <div class="hub">

    <a class="hub-card" href="/fx/FX_관리_대시보드.html">
      <div class="hub-icon">💱</div>
      <div class="hub-title">FX 관리</div>
      <div class="hub-desc">더스크랙 · 드래프터 · 데이즈 외화 대시보드</div>
      <span class="hub-badge ready">실시간</span>
    </a>

    <a class="hub-card featured" href="/weekly.html">
      <div class="hub-icon">📊</div>
      <div class="hub-title">주간 보고</div>
      <div class="hub-desc">주차별 현금흐름 보고서</div>
      <span class="hub-badge ready">최신 08/09 · 총 10건</span>
    </a>

    <a class="hub-card" href="/monthly.html">
      <div class="hub-icon">📋</div>
      <div class="hub-title">월간 보고</div>
      <div class="hub-desc">월별 재무 현황 보고서</div>
      <span class="hub-badge ready">최신 7월 · 총 7건</span>
    </a>

  </div>
</div>

<div class="footer">
  © 2026 더스크그룹 경영지원팀 · 내부 경영보고 전용
</div>
</body>
</html>
